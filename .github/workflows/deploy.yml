name: Build site and Mac player package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:respawn
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Check demo viewer
        run: |
          npm ci --prefix services/demo-viewer
          python3 -m unittest discover -s services/demo-viewer/tests -p 'test_*.py'
          node --test services/demo-viewer/tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arena1-mac-release
          path: |
            dist/
            services/demo-viewer/
            scripts/deploy-demo-viewer-mac.py
